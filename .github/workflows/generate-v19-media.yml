name: Generate V19 Original Motion Media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet pillow numpy
      - name: Render deterministic Zepto Logic film
        run: python scripts/generate_v19_media.py
      - name: Validate media
        run: |
          test -s assets/media/zlt-silicon-film.webm
          test -s assets/media/zlt-silicon-film.mp4
          test -s assets/media/zlt-silicon-film-mobile.webm
          test -s assets/media/zlt-silicon-film-mobile.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 assets/media/zlt-silicon-film.webm
      - name: Commit rendered media
        run: |
          git config user.name "Zepto Logic Motion Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/media/
          if git diff --cached --quiet; then
            echo "Motion media already current."
          else
            git commit -m "V19 — render original semiconductor motion media"
            git push origin HEAD:main
          fi
