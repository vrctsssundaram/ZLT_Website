name: Website Release QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static-qa:
    name: Static integrity and disclosure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/site_qa.py
      - run: python scripts/deep_qa.py
      - run: node --check assets/site-v31.js
  browser-qa:
    name: Responsive, accessibility and enquiry tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start test server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/zlt-test-server.log 2>&1 &
      - name: Test Chromium, Firefox and WebKit
        run: npx playwright test tests/v31.spec.js --reporter=line --workers=4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v31-browser-review
          path: test-results/
          retention-days: 14
  production-package:
    name: Verified production package
    needs: [static-qa, browser-qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/prepare_production.py /tmp/zeptologic-production
      - run: python scripts/production_audit.py /tmp/zeptologic-production
      - uses: actions/upload-artifact@v7
        with:
          name: zeptologic-v31-production-ready
          path: /tmp/zeptologic-production
          include-hidden-files: true
          retention-days: 14
