name: Website Release QA

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "*.html"
      - "assets/**"
      - "tests/**"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/site_qa.py"
      - "scripts/deep_qa.py"
      - "scripts/prepare_production.py"
      - "scripts/production_audit.py"
      - "playwright.config.js"
      - ".github/workflows/site-qa.yml"

concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-qa:
    name: Static integrity, SEO and disclosure guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run zero-dependency V29 site QA
        run: python scripts/site_qa.py
      - name: Run deep V29 integrity and production-readiness QA
        run: python scripts/deep_qa.py
      - name: Validate JavaScript syntax
        run: node --check assets/site.js

  browser-qa:
    name: Responsive browser, accessibility, zoom and conversion QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start static site server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zlt-site.log 2>&1 &
          echo $! >/tmp/zlt-site.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
      - name: Verify enquiry CORS when external endpoint is reachable
        run: |
          endpoint="https://nujmuknvhgyoxhxuvscx.supabase.co/functions/v1/website-enquiry"
          check_origin () {
            origin="$1"
            headers=$(mktemp)
            body=$(mktemp)
            set +e
            code=$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 --dump-header "$headers" --output "$body" \
              --write-out "%{http_code}" -X OPTIONS "$endpoint" \
              -H "Origin: $origin" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type")
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::External enquiry endpoint was unreachable from this Actions runner (curl exit $rc). Front-end/browser QA will continue; this is not treated as a CORS response failure."
              return 2
            fi
            if [ "$code" != "204" ]; then
              echo "Enquiry endpoint responded for $origin but returned HTTP $code instead of 204."
              cat "$headers"
              return 1
            fi
            allow=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")
            if [ "$allow" != "*" ] && [ "$allow" != "$origin" ]; then
              echo "CORS allow-origin mismatch for $origin: '$allow'"
              cat "$headers"
              return 1
            fi
            echo "CORS verified for $origin"
            return 0
          }
          for origin in "https://vrctsssundaram.github.io" "https://zeptologic.com" "https://www.zeptologic.com"; do
            set +e
            check_origin "$origin"
            rc=$?
            set -e
            if [ "$rc" -eq 1 ]; then exit 1; fi
            if [ "$rc" -eq 2 ]; then
              echo "External CORS verification deferred because the runner could not reach the endpoint."
              break
            fi
          done
      - name: Run Chromium functional, accessibility and V29 orientation/zoom matrix
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/site.spec.js tests/v28-boardroom.spec.js --reporter=line --workers=4 --project=chromium
      - name: Upload responsive review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v29-responsive-zoom-review-screenshots
          path: test-results/screens
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Firefox and WebKit cross-browser smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/cross-browser.spec.js --reporter=line --workers=2 --project=firefox --project=webkit

  production-package:
    name: Production package and migration readiness
    needs: [static-qa, browser-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build production package without mutating staging
        run: python scripts/prepare_production.py /tmp/zeptologic-production
      - name: Audit V29 production package
        run: python scripts/production_audit.py /tmp/zeptologic-production
      - name: Upload production-ready migration artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeptologic-v29-production-ready
          path: /tmp/zeptologic-production
          if-no-files-found: error
          retention-days: 14
