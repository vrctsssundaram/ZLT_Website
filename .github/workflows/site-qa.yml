name: Website Release QA

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "*.html"
      - "assets/**"
      - "tests/**"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/site_qa.py"
      - "scripts/deep_qa.py"
      - "scripts/prepare_production.py"
      - "scripts/production_audit.py"
      - "playwright.config.js"
      - ".github/workflows/site-qa.yml"

permissions:
  contents: read

jobs:
  static-qa:
    name: Static integrity, SEO and disclosure guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run zero-dependency site QA
        run: python scripts/site_qa.py
      - name: Run deep integrity and asset-budget QA
        run: python scripts/deep_qa.py
      - name: Validate JavaScript syntax
        run: node --check assets/site.js

  browser-qa:
    name: Responsive browser, accessibility and conversion QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start static site server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zlt-site.log 2>&1 &
          echo $! >/tmp/zlt-site.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
      - name: Verify staging and production enquiry CORS without writing a lead
        run: |
          check_origin () {
            origin="$1"
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out "%{http_code}" \
              -X OPTIONS "https://nujmuknvhgyoxhxuvscx.supabase.co/functions/v1/website-enquiry" \
              -H "Origin: $origin" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type")
            test "$code" = "204"
            allow=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")
            test "$allow" = "*" -o "$allow" = "$origin"
          }
          check_origin "https://vrctsssundaram.github.io"
          check_origin "https://zeptologic.com"
          check_origin "https://www.zeptologic.com"
      - name: Run multi-device browser suite
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/site.spec.js --reporter=line --workers=4 --project=chromium
      - name: Upload responsive review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-review-screenshots
          path: test-results/screens
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Firefox and WebKit cross-browser smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/cross-browser.spec.js --reporter=line --workers=2 --project=firefox --project=webkit


  production-package:
    name: Production package and migration readiness
    needs: [static-qa, browser-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build production package without mutating staging
        run: python scripts/prepare_production.py /tmp/zeptologic-production
      - name: Audit production package
        run: python scripts/production_audit.py /tmp/zeptologic-production
      - name: Upload production-ready migration artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeptologic-production-ready
          path: /tmp/zeptologic-production
          if-no-files-found: error
          retention-days: 14
