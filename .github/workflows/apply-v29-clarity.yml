name: Apply V29 Executive Clarity

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_v29_clarity.py
      - .github/workflows/apply-v29-clarity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v29-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply V29 executive clarity migration
        run: python scripts/apply_v29_clarity.py
      - name: Guarantee V29 stylesheet on every HTML shell
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          css='<link rel="stylesheet" href="assets/v29-clarity.css">'
          for p in root.glob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'assets/v29-clarity.css' not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'{p}: missing </head>')
                  text=text.replace('</head>',css+'</head>',1)
                  p.write_text(text,encoding='utf-8')
          PY
      - name: Verify V29 invariants before commit
        run: |
          node --check assets/site.js
          test -f assets/v29-clarity.css
          grep -q 'Semiconductor IP. Engineering services. Applied R&amp;D.' index.html
          grep -q 'Semiconductor consultation' index.html
          grep -q 'Co-creation · Collaboration' index.html
          grep -q 'Co-opting specialist capability' index.html
          grep -q 'Consultation' services.html
          grep -q 'Design &amp; prototyping lab' services.html
          ! grep -R --include='*.html' -n '<video' .
          for f in *.html; do
            grep -q 'assets/v29-clarity.css' "$f"
          done
      - name: Commit transformed site
        run: |
          git config user.name "Zepto Logic Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "V29 already applied."
            exit 0
          fi
          git commit -m "V29 — simplify semiconductor offerings and navigation"
          git pull --rebase origin main
          git push origin HEAD:main
